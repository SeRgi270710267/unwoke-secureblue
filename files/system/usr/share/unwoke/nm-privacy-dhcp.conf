# Unwoke: do not send hostname; RFC 7844-ish DHCP IDs; IPv6 stable-privacy.
# Relies on stock MAC randomization. Revert: ujust set-dhcp-hostname on
[main]
hostname-mode=none

[connection]
ipv4.dhcp-send-hostname=false
ipv6.dhcp-send-hostname=false
ipv4.dhcp-client-id=mac
ipv6.dhcp-duid=ll
ipv6.addr-gen-mode=stable-privacy
