# Copied to /etc/gamemode.ini at compose. Restores when GameMode clients exit.
[general]
desiredgov=performance
desiredprof=performance
inhibit_screensaver=1
# Windows/Proton titles stutter with split-lock detect. GameMode puts this back.
disable_splitlock=1
ioprio=0
renice=0
softrealtime=off

[gpu]
apply_gpu_optimisations=accept-responsibility
gpu_device=0
nv_powermizer_mode=1
amd_performance_level=high

[cpu]
park_cores=no
pin_cores=yes
