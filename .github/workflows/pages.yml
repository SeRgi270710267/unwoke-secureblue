name: pages
on:
  schedule:
    - cron: "30 09 * * *"
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
      issues: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Mirror stock secureblue.dev docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m venv /tmp/sbdocs
          /tmp/sbdocs/bin/pip install "markdown==3.8.2"
          /tmp/sbdocs/bin/python .github/scripts/mirror-secureblue-docs.py
          report=docs/secureblue/unwoke-cmd-report.json
          if [[ -f "${report}" ]] && python3 -c "import json,sys; sys.exit(0 if not json.load(open(sys.argv[1])).get('unmatched') else 1)" "${report}"; then
            bash .github/scripts/issue-alarm.sh mirror-cmds close || true
          else
            bash .github/scripts/issue-alarm.sh mirror-cmds open || true
          fi

      - name: Generate people-facing progress
        run: python3 docs/_tools/generate-progress.py

      - name: Generate public changelog
        run: python3 docs/_tools/generate-changelog.py

      - name: Generate tutorials hub from vendor list
        run: python3 docs/_tools/generate-tutorials.py

      - name: Stock FEATs we shipped first
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 docs/_tools/generate-stock-feats.py

      - name: Stock issues that hit Unwoke
        env:
          GITHUB_TOKEN: ${{ github.token }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          UNWOKE_AI_KEY: ${{ secrets.UNWOKE_AI_KEY }}
          UNWOKE_AI_BASE: ${{ secrets.UNWOKE_AI_BASE }}
          UNWOKE_AI_MODEL: ${{ secrets.UNWOKE_AI_MODEL }}
        run: python3 docs/_tools/generate-stock-issues.py

      - name: Last-green factory stamp
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/write-factory-status.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  pages-alarm:
    name: Pages alarm
    if: always() && !cancelled() && github.actor != 'dependabot[bot]'
    needs: [deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Open or update alarm
        if: needs.deploy.result == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/issue-alarm.sh pages open

      - name: Close alarm
        if: needs.deploy.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/issue-alarm.sh pages close
