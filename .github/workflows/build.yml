name: bluebuild
on:
  schedule:
    - cron: "00 08 * * *"
    - cron: "00 20 * * *"
  push:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - "docs/**"
      - ".github/workflows/iso.yml"
      - ".github/workflows/verify.yml"
      - ".github/workflows/pages.yml"
      - ".github/scripts/mirror-secureblue-docs.py"
      - ".github/scripts/mirror-template.html"
  pull_request:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  canary:
    name: Canary ${{ matrix.base }}
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        base:
          - ghcr.io/secureblue/silverblue-main-hardened
          - ghcr.io/secureblue/silverblue-nvidia-open-hardened
          - ghcr.io/secureblue/kinoite-main-hardened
          - ghcr.io/secureblue/kinoite-nvidia-open-hardened
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Scan signed stock base (do not run it)
        run: bash .github/scripts/scan-base-canary.sh "${{ matrix.base }}"

  upstream-watch:
    name: Watch stock scripts
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Auto-refresh snapshots on main
        if: github.event_name != 'pull_request'
        run: bash .github/scripts/auto-refresh-snapshots.sh

      - name: Compare stock scripts (pull request)
        if: github.event_name == 'pull_request'
        run: bash .github/scripts/check-upstream-watch.sh

      - name: Upload drifted stock files
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stock-script-drift
          path: upstream-drift/
          if-no-files-found: ignore

  bluebuild:
    name: Build ${{ matrix.recipe }}
    if: github.actor != 'dependabot[bot]'
    needs: canary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - unwoke-silverblue.yml
          - unwoke-silverblue-nvidia-open.yml
          - unwoke-kinoite.yml
          - unwoke-kinoite-nvidia-open.yml
          - unwoke-silverblue-browserless.yml
          - unwoke-silverblue-nvidia-open-browserless.yml
          - unwoke-kinoite-browserless.yml
          - unwoke-kinoite-nvidia-open-browserless.yml
          - unwoke-silverblue-trivalent.yml
          - unwoke-silverblue-nvidia-open-trivalent.yml
          - unwoke-kinoite-trivalent.yml
          - unwoke-kinoite-nvidia-open-trivalent.yml
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify and pin official secureblue base
        run: bash .github/scripts/verify-pin-base.sh "recipes/${{ matrix.recipe }}"

      - name: Build Custom Image
        uses: blue-build/github-action@24d146df25adc2cf579e918efe2d9bff6adea408 # v1.11
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
          skip_checkout: true
          verify_install: true

      - name: Read image digest
        if: github.event_name != 'pull_request'
        id: digest
        run: |
          set -euo pipefail
          NAME="${{ matrix.recipe }}"
          NAME="${NAME%.yml}"
          # GHCR path for pulling (with tag) vs attest subject (no tag — GitHub rejects :latest)
          REF="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${NAME}:latest"
          SUBJECT="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${NAME}"
          DIGEST="$(cosign verify --key cosign.pub "${REF}" 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["critical"]["image"]["docker-manifest-digest"])')"
          [[ "${DIGEST}" == sha256:* ]]
          echo "name=${NAME}" >> "${GITHUB_OUTPUT}"
          echo "image=${SUBJECT}" >> "${GITHUB_OUTPUT}"
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"
          echo "Signed digest ${SUBJECT}@${DIGEST}"

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ steps.digest.outputs.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Inspect published flavor
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NAME="${{ matrix.recipe }}"
          NAME="${NAME%.yml}"
          bash .github/scripts/inspect-flavor.sh "${NAME}"

  factory-alarm:
    name: Factory alarm
    if: always() && !cancelled() && github.event_name != 'pull_request' && github.actor != 'dependabot[bot]'
    needs: [canary, upstream-watch, bluebuild]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Open or update alarm
        if: needs.canary.result == 'failure' || needs.upstream-watch.result == 'failure' || needs.bluebuild.result == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/factory-alarm.sh open

      - name: Close alarm
        if: needs.canary.result == 'success' && needs.upstream-watch.result == 'success' && needs.bluebuild.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/factory-alarm.sh close
