name: bluebuild
on:
  schedule:
    - cron: "00 08 * * *"
    - cron: "00 20 * * *"
  push:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".github/workflows/iso.yml"
      - ".github/workflows/verify.yml"
  pull_request:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  bluebuild:
    name: Build ${{ matrix.recipe }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - unwoke-silverblue.yml
          - unwoke-silverblue-nvidia-open.yml
          - unwoke-kinoite.yml
          - unwoke-kinoite-nvidia-open.yml
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify and pin official secureblue base
        run: bash .github/scripts/verify-pin-base.sh "recipes/${{ matrix.recipe }}"

      - name: Build Custom Image
        uses: blue-build/github-action@836161eb076426a451e6a0054f722b1153b8b3ad # v1.12.0
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
          skip_checkout: true
          verify_install: true

      - name: Read image digest
        if: github.event_name != 'pull_request'
        id: digest
        run: |
          set -euo pipefail
          NAME="${{ matrix.recipe }}"
          NAME="${NAME%.yml}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${NAME}:latest"
          DIGEST="$(cosign verify --key cosign.pub "${IMAGE}" 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["critical"]["image"]["docker-manifest-digest"])')"
          [[ "${DIGEST}" == sha256:* ]]
          echo "name=${NAME}" >> "${GITHUB_OUTPUT}"
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"
          echo "Signed digest ${IMAGE}@${DIGEST}"

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ steps.digest.outputs.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
