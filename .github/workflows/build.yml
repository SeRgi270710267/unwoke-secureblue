name: bluebuild
on:
  schedule:
    # Twice a day, after secureblue's usual rebuilds.
    - cron: "00 08 * * *"
    - cron: "00 20 * * *"
  push:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".github/workflows/iso.yml"
      - ".github/workflows/verify.yml"
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  bluebuild:
    name: Build ${{ matrix.recipe }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - unwoke-silverblue.yml
          - unwoke-silverblue-nvidia-open.yml
          - unwoke-kinoite.yml
          - unwoke-kinoite-nvidia-open.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify and pin official secureblue base
        run: bash .github/scripts/verify-pin-base.sh "recipes/${{ matrix.recipe }}"

      - name: Build Custom Image
        uses: blue-build/github-action@v1.11
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
          skip_checkout: true
          verify_install: true
