name: bluebuild
on:
  schedule:
    - cron: "00 08 * * *"
    - cron: "00 20 * * *"
  push:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - "docs/**"
      - ".github/workflows/iso.yml"
      - ".github/workflows/isos/**"
      - ".github/workflows/verify.yml"
      - ".github/workflows/pages.yml"
      - ".github/workflows/vendor-watch.yml"
      - ".github/scripts/vendor-alarm.sh"
      - ".github/scripts/issue-alarm.sh"
      - "docs/_tools/generate-tutorials.py"
      - "docs/_tools/tutorials-core.json"
      - ".github/scripts/install-just.sh"
      - ".github/scripts/install-oras.sh"
      - ".github/scripts/public-packages.sh"
      - ".github/scripts/package-visibility.sh"
      - ".github/scripts/package-names.txt"
      - ".github/scripts/invite_sync.py"
      - ".github/scripts/invite_policy.py"
      - ".github/scripts/cloudflare_access.py"
      - ".github/scripts/render_notice.py"
      - ".github/scripts/publish-iso.sh"
      - ".github/scripts/ghcr-push-guard.sh"
      - ".github/scripts/r2_iso.py"
      - ".github/scripts/install-rclone.sh"
      - "functions/**"
      - "wrangler.toml"
      - ".github/scripts/rehost-watch.sh"
      - ".github/workflows/rehost-watch.yml"
      - "TRADEMARK.md"
      - ".github/workflows/invite-sync.yml"
      - ".github/workflows/iso-purge.yml"
      - "invite/**"
      - "site-notice/**"
      - ".github/scripts/write-factory-status.py"
      - ".github/scripts/mirror-secureblue-docs.py"
      - ".github/scripts/mirror-template.html"
      - ".github/workflows/pr-gate.yml"
      - ".github/workflows/flake-rerun.yml"
      - ".github/workflows/bake-keepalive.yml"
      - ".github/workflows/actions-cleanup.yml"
      - ".github/workflows/health.yml"
      - ".github/scripts/health_report.py"
      - ".github/scripts/secret_scan.py"
      - ".github/scripts/action_pin_guard.py"
      - ".github/scripts/workflow_policy.py"
      - ".github/scripts/bake_keepalive.py"
      - ".github/scripts/actions_cleanup.py"
      - ".github/scripts/shellcheck-tree.sh"
      - ".github/scripts/install_git_hooks.sh"
      - ".github/CODEOWNERS"
      - ".github/ISSUE_TEMPLATE/**"
      - ".agents/**"
      - "AGENTS.md"
      - "GEMINI.md"
  pull_request:
  workflow_dispatch:
permissions: {}
concurrency:
  # Pull requests: a new push cancels that PR's older bake.
  # main and the schedule share github.ref, so a later push queues.
  # Do not kill a bake that is already running on main.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  canary:
    name: Canary ${{ matrix.base }}
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        base:
          - ghcr.io/secureblue/silverblue-main-hardened
          - ghcr.io/secureblue/silverblue-nvidia-open-hardened
          - ghcr.io/secureblue/kinoite-main-hardened
          - ghcr.io/secureblue/kinoite-nvidia-open-hardened
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Scan signed stock base (do not run it)
        run: bash .github/scripts/scan-base-canary.sh "${{ matrix.base }}"

  upstream-watch:
    name: Watch stock scripts
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Auto-refresh snapshots on main
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/auto-refresh-snapshots.sh

      - name: Compare stock scripts (pull request)
        if: github.event_name == 'pull_request'
        run: bash .github/scripts/check-upstream-watch.sh

      - name: Upload drifted stock files
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stock-script-drift
          path: upstream-drift/
          if-no-files-found: ignore

  bluebuild:
    name: Build ${{ matrix.recipe }}
    if: github.actor != 'dependabot[bot]'
    needs: canary
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - unwoke-silverblue.yml
          - unwoke-silverblue-nvidia-open.yml
          - unwoke-kinoite.yml
          - unwoke-kinoite-nvidia-open.yml
          - unwoke-silverblue-browserless.yml
          - unwoke-silverblue-nvidia-open-browserless.yml
          - unwoke-kinoite-browserless.yml
          - unwoke-kinoite-nvidia-open-browserless.yml
          - unwoke-silverblue-trivalent.yml
          - unwoke-silverblue-nvidia-open-trivalent.yml
          - unwoke-kinoite-trivalent.yml
          - unwoke-kinoite-nvidia-open-trivalent.yml
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify and pin official secureblue base
        run: bash .github/scripts/verify-pin-base.sh "recipes/${{ matrix.recipe }}"

      # A missing package must be created with the classic PAT. GITHUB_TOKEN
      # from this public repository publishes a package the world can pull.
      - name: Choose registry token
        id: ghcr
        env:
          GHCR_PUBLISH_TOKEN: ${{ secrets.GHCR_PUBLISH_TOKEN }}
          IMAGE_NAME: ${{ matrix.recipe }}
        run: |
          set -euo pipefail
          IMAGE_NAME="${IMAGE_NAME%.yml}"
          export IMAGE_NAME
          bash .github/scripts/ghcr-push-guard.sh preflight

      - name: Build Custom Image
        uses: blue-build/github-action@24d146df25adc2cf579e918efe2d9bff6adea408 # v1.11
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ steps.ghcr.outputs.use_publish == 'true' && secrets.GHCR_PUBLISH_TOKEN || github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
          skip_checkout: true
          verify_install: true

      - name: Anonymous pull must be denied
        if: success() && github.event_name != 'pull_request'
        env:
          IMAGE_NAME: ${{ matrix.recipe }}
        run: |
          set -euo pipefail
          IMAGE_NAME="${IMAGE_NAME%.yml}"
          export IMAGE_NAME
          bash .github/scripts/ghcr-push-guard.sh post

      - name: Read image digest
        if: success() && github.event_name != 'pull_request'
        id: digest
        env:
          REGISTRY_TOKEN: ${{ steps.ghcr.outputs.use_publish == 'true' && secrets.GHCR_PUBLISH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          NAME="${{ matrix.recipe }}"
          NAME="${NAME%.yml}"
          REF="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${NAME}:latest"
          login_user="${GITHUB_ACTOR}"
          if [[ "${{ steps.ghcr.outputs.use_publish }}" == "true" ]]; then
            login_user="${GITHUB_REPOSITORY_OWNER}"
          fi
          echo "${REGISTRY_TOKEN}" | cosign login ghcr.io -u "${login_user}" --password-stdin
          # Certificate attestations otherwise win and cosign prints no JSON.
          extra=()
          if cosign verify --help 2>&1 | grep -q -- '--new-bundle-format'; then
            extra+=(--new-bundle-format=false)
          fi
          ok=0
          for _n in 1 2 3 4 5; do
            if COSIGN_OCI_EXPERIMENTAL=0 cosign verify --key cosign.pub "${extra[@]}" "${REF}" >/dev/null; then
              ok=1
              break
            fi
            sleep 10
          done
          [[ "${ok}" -eq 1 ]]
          echo "signature verified"

      - name: Inspect published flavor
        if: success() && github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ steps.ghcr.outputs.use_publish == 'true' && secrets.GHCR_PUBLISH_TOKEN || github.token }}
          GHCR_LOGIN_USER: ${{ steps.ghcr.outputs.use_publish == 'true' && github.repository_owner || github.actor }}
        run: |
          set -euo pipefail
          NAME="${{ matrix.recipe }}"
          NAME="${NAME%.yml}"
          bash .github/scripts/inspect-flavor.sh "${NAME}"

      # Public provenance attestation is not published. It put the image
      # name and digest on a public log. Cosign key signing still runs.

  public-packages:
    name: GHCR stays private
    if: always() && !cancelled() && github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' && needs.bluebuild.result != 'skipped'
    needs: [bluebuild]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      issues: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Anonymous pull must fail
        env:
          GH_TOKEN: ${{ github.token }}
          ALARM: "1"
        run: bash .github/scripts/package-visibility.sh

  receipt:
    name: Receipt release
    if: always() && !cancelled() && github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' && needs.bluebuild.result != 'skipped'
    needs: [bluebuild]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      packages: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Retire public receipt release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash docs/_tools/publish-receipt.sh

  factory-alarm:
    name: Factory alarm
    # A download blip does not open the alarm on attempt 1. flake-rerun.yml
    # reruns those jobs once after this run has finished. Attempt 2 still alarms.
    # Inspect, a canary needle, and a signing-key change alarm immediately.
    if: always() && !cancelled() && github.event_name != 'pull_request' && github.actor != 'dependabot[bot]'
    needs: [canary, upstream-watch, bluebuild, receipt]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download flake?
        id: flake
        if: github.run_attempt == 1 && (needs.canary.result == 'failure' || needs.upstream-watch.result == 'failure' || needs.bluebuild.result == 'failure' || needs.receipt.result == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          bash .github/scripts/rerun-cosign-flake.sh classify
          rc=$?
          set -e
          if [[ "${rc}" -eq 0 ]]; then
            echo "flake=yes" >> "${GITHUB_OUTPUT}"
          else
            echo "flake=no" >> "${GITHUB_OUTPUT}"
          fi

      - name: Open or update alarm
        if: (needs.canary.result == 'failure' || needs.upstream-watch.result == 'failure' || needs.bluebuild.result == 'failure' || needs.receipt.result == 'failure') && steps.flake.outputs.flake != 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/factory-alarm.sh open

      - name: Close alarm
        if: needs.canary.result == 'success' && needs.upstream-watch.result == 'success' && needs.bluebuild.result == 'success' && (needs.receipt.result == 'success' || needs.receipt.result == 'skipped')
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/factory-alarm.sh close
