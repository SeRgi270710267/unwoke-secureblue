name: iso-purge
# Owner-only. Deletes Actions artifacts whose names look like ISOs.
# Does not delete the repository, the packages, or GitHub Pages.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type delete-iso-artifacts
        required: true
        type: string
permissions: {}
concurrency:
  group: iso-purge
  cancel-in-progress: false
jobs:
  purge:
    name: Delete ISO artifacts
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'delete-iso-artifacts'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Delete ISO artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_ACTOR}" != "${GITHUB_REPOSITORY_OWNER}" ]]; then
            echo "refused" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/actions/artifacts?per_page=100"
          deleted = 0
          while url:
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "unwoke-iso-purge",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  payload = json.loads(resp.read().decode())
                  link = resp.headers.get("Link", "")
              url = ""
              for part in link.split(","):
                  if 'rel="next"' in part:
                      url = part.split(";")[0].strip().strip("<>")
              for item in payload.get("artifacts") or []:
                  name = item.get("name") or ""
                  if "iso" not in name.lower():
                      continue
                  artifact_id = item["id"]
                  print(f"delete artifact {artifact_id} {name}")
                  drop = urllib.request.Request(
                      f"https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}",
                      headers={
                          "Authorization": f"Bearer {token}",
                          "Accept": "application/vnd.github+json",
                          "User-Agent": "unwoke-iso-purge",
                      },
                      method="DELETE",
                  )
                  with urllib.request.urlopen(drop, timeout=30) as resp:
                      if resp.status not in (200, 204):
                          raise SystemExit(f"delete failed {resp.status}")
                  deleted += 1
          print(f"deleted {deleted}")
          PY
