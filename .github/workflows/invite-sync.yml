name: invite-sync
# Owner-only. Reads invite/allowlist.txt and grants Read.
# A pull request cannot run this. A workflow input cannot add a login.
on:
  workflow_dispatch:
    inputs:
      action:
        description: audit compares GitHub to the allowlist. sync grants Read and removes everyone else.
        required: true
        type: choice
        default: audit
        options:
          - audit
          - sync
  push:
    branches: [main]
    paths:
      - invite/allowlist.txt
      - .github/workflows/invite-sync.yml
      - .github/scripts/invite_sync.py
permissions: {}
concurrency:
  group: invite-sync
  cancel-in-progress: false
jobs:
  sync:
    name: Allowlist ${{ github.event.inputs.action || 'sync' }}
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: main

      - name: Refuse a non-owner
        run: |
          set -euo pipefail
          if [[ "${GITHUB_ACTOR}" != "${GITHUB_REPOSITORY_OWNER}" ]]; then
            echo "refused: only the repository owner may grant access" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "refused: not main" >&2
            exit 1
          fi
          case "${GITHUB_EVENT_NAME}" in
            workflow_dispatch|push) ;;
            *)
              echo "refused: ${GITHUB_EVENT_NAME}" >&2
              exit 1
              ;;
          esac

      - name: Audit or sync collaborators
        env:
          GH_TOKEN: ${{ secrets.INVITE_ADMIN_TOKEN }}
          INVITE_ADMIN_TOKEN: ${{ secrets.INVITE_ADMIN_TOKEN }}
          ACTION: ${{ github.event.inputs.action || 'sync' }}
        run: |
          set -euo pipefail
          python3 .github/scripts/invite_sync.py --selftest
          # Do not xtrace. The admin token is in the environment.
          python3 .github/scripts/invite_sync.py "${ACTION}"
