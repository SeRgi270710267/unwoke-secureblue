name: vendor-watch
on:
  schedule:
    - cron: "15 09 * * *"
    - cron: "15 21 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: vendor-watch
  cancel-in-progress: true
jobs:
  check:
    name: Vendor installer contracts
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Schema
        run: python3 files/system/usr/libexec/unwoke/vendor.py schema

      - name: Relocate 404 stock snapshot URLs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 docs/_tools/relocate-stock-urls.py
          git add .github/scripts/upstream-watch.txt
          if git diff --cached --quiet; then
            echo "stock watch URLs current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$(cat <<'EOF'
          Relocate stock snapshot URLs inside secureblue/live.

          Same GitHub repo allowlist. Same filename. Does not exec their Python.
          Content hash refresh stays on the overlay watch job after a targeting scan.
          EOF
          )"
          git push origin HEAD

      - name: Check vendor contracts
        id: probe
        continue-on-error: true
        run: python3 files/system/usr/libexec/unwoke/vendor.py check --probe-rpm

      - name: Heal allowlisted URL moves
        if: steps.probe.outcome == 'failure'
        id: heal
        continue-on-error: true
        run: python3 files/system/usr/libexec/unwoke/vendor.py heal --probe-rpm

      - name: Commit healed vendor list
        if: steps.heal.outcome == 'success' && steps.probe.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 docs/_tools/generate-tutorials.py
          git add files/system/usr/share/unwoke/vendor-installers.json docs/tutorials
          if git diff --cached --quiet; then
            echo "no JSON or tutorial change"
            exit 0
          fi
          git commit -m "$(cat <<'EOF'
          Refresh vendor installer URLs from official allowlisted pages.

          Allowlisted HTTPS hosts only. Still require SHA512 / gpgcheck.
          No Flathub. No auto-weakening. Tutorial hub regenerated from the same list.
          EOF
          )"
          git push origin HEAD

      - name: Recheck
        id: recheck
        if: always() && !cancelled()
        continue-on-error: true
        run: python3 files/system/usr/libexec/unwoke/vendor.py check --probe-rpm

      - name: Keep tutorial hub in sync
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 docs/_tools/generate-tutorials.py
          git add docs/tutorials
          if git diff --cached --quiet; then
            echo "tutorial hub already matches vendor list"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$(cat <<'EOF'
          Sync tutorials hub with vendor-installers.json.

          Generated pages only. Does not unlock Flathub or add hosts.
          EOF
          )"
          git push origin HEAD

      - name: Alarm
        if: steps.recheck.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/vendor-alarm.sh open

      - name: Clear alarm
        if: steps.recheck.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/vendor-alarm.sh close

      - name: Heartbeat if main is idle
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash docs/_tools/factory-heartbeat.sh

      - name: Fail job if still broken
        if: steps.recheck.outcome == 'failure'
        run: exit 1
