name: vendor-watch
on:
  schedule:
    - cron: "15 09 * * *"
    - cron: "15 21 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: vendor-watch
  cancel-in-progress: true
jobs:
  check:
    name: Vendor installer contracts
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check Proton / IVPN contracts
        id: probe
        continue-on-error: true
        run: python3 files/system/usr/libexec/unwoke/vendor.py check --probe-rpm

      - name: Alarm
        if: steps.probe.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/vendor-alarm.sh open

      - name: Clear alarm
        if: steps.probe.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/vendor-alarm.sh close

      - name: Fail job if contracts broke
        if: steps.probe.outcome == 'failure'
        run: exit 1
