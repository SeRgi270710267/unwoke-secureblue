name: pr-gate
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions: {}
concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    name: Strict PR gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: CODEOWNERS present
        run: test -s .github/CODEOWNERS

      - name: No pull_request_target / auto-merge in workflows
        run: |
          set -euo pipefail
          # Match a workflow trigger or an auto-merge action input, not this
          # check's own name. A bare grep matches the line that names the ban.
          if grep -R --include='*.yml' --include='*.yaml' -nE \
            '^[[:space:]]*(-\s*)?(pull_request_target|enable-auto-merge):' \
            .github/workflows; then
            echo "FAIL: pull_request_target or auto-merge is not allowed" >&2
            exit 1
          fi

      - name: Forbidden weakenings in the PR diff
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          fail=0
          while IFS= read -r f; do
            [[ -n "$f" ]] || continue
            case "$f" in
              *.md|docs/*|.github/pull_request_template.md) continue ;;
            esac
            if git diff "origin/${{ github.base_ref }}...HEAD" -- "$f" | grep '^+' | grep -Eiq \
              'gpgcheck[[:space:]]*=[[:space:]]*0|setenforce[[:space:]]+0|BEGIN [A-Z ]*PRIVATE KEY'; then
              echo "FAIL: $f" >&2
              fail=1
            fi
          done < <(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Eiq '(^|/)cosign\.key$|(^|/)SIGNING_SECRET'; then
            echo "FAIL: secret-looking path in the PR" >&2
            fail=1
          fi
          exit "${fail}"

      - name: Vendor schema
        run: python3 files/system/usr/libexec/unwoke/vendor.py schema

      - name: Compile overlay Python
        run: |
          python3 -m py_compile files/system/usr/libexec/unwoke/vendor.py
          python3 -m py_compile files/system/usr/libexec/unwoke/setup-gui.py
          python3 -m py_compile files/system/usr/libexec/unwoke/mark-check.py
          python3 -m py_compile files/system/usr/libexec/unwoke/ca-trim-build.py
          python3 -m py_compile files/system/usr/libexec/unwoke/invite_auth.py
          python3 -m py_compile .github/scripts/invite_sync.py
          python3 -m py_compile .github/scripts/invite_policy.py
          python3 -m py_compile .github/scripts/cloudflare_access.py
          python3 -m py_compile .github/scripts/render_notice.py
          python3 -m py_compile docs/_tools/generate-progress.py
          python3 -m py_compile docs/_tools/generate-stock-issues.py
          python3 -m py_compile docs/_tools/generate-stock-feats.py
          python3 -m py_compile docs/_tools/stamp-unwoke-mark.py
          python3 -m py_compile .github/scripts/mirror-secureblue-docs.py

      - name: Public mark on overlay sources
        run: python3 files/system/usr/libexec/unwoke/mark-check.py --tree .

      - name: Secret scan
        run: |
          python3 .github/scripts/secret_scan.py --selftest
          python3 .github/scripts/secret_scan.py

      - name: Action pins and workflow policy
        run: |
          python3 .github/scripts/action_pin_guard.py --selftest
          python3 .github/scripts/action_pin_guard.py
          python3 .github/scripts/workflow_policy.py --selftest
          python3 .github/scripts/workflow_policy.py
          python3 .github/scripts/bake_keepalive.py --selftest
          python3 .github/scripts/actions_cleanup.py --selftest
          python3 .github/scripts/health_report.py --selftest
          python3 .github/scripts/invite_policy.py --selftest
          python3 .github/scripts/invite_policy.py
          python3 .github/scripts/invite_sync.py --selftest
          python3 files/system/usr/libexec/unwoke/invite_auth.py --selftest
          python3 .github/scripts/cloudflare_access.py --selftest
          python3 .github/scripts/render_notice.py --selftest

      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          bash .github/scripts/shellcheck-tree.sh
