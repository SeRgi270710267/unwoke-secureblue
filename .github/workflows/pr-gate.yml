name: pr-gate
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions: {}
concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    name: Strict PR gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: CODEOWNERS present
        run: test -s .github/CODEOWNERS

      - name: No pull_request_target / auto-merge in workflows
        run: |
          set -euo pipefail
          if grep -R --include='*.yml' --include='*.yaml' -nE 'pull_request_target|enable-auto-merge' .github/workflows; then
            echo "FAIL: pull_request_target or auto-merge is not allowed" >&2
            exit 1
          fi

      - name: Forbidden weakenings in the PR diff
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          fail=0
          while IFS= read -r f; do
            [[ -n "$f" ]] || continue
            case "$f" in
              *.md|docs/*|.github/pull_request_template.md) continue ;;
            esac
            if git diff "origin/${{ github.base_ref }}...HEAD" -- "$f" | grep '^+' | grep -Eiq \
              'gpgcheck[[:space:]]*=[[:space:]]*0|setenforce[[:space:]]+0|BEGIN [A-Z ]*PRIVATE KEY'; then
              echo "FAIL: $f" >&2
              fail=1
            fi
          done < <(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Eiq '(^|/)cosign\.key$|(^|/)SIGNING_SECRET'; then
            echo "FAIL: secret-looking path in the PR" >&2
            fail=1
          fi
          exit "${fail}"

      - name: Vendor schema
        run: python3 files/system/usr/libexec/unwoke/vendor.py schema

      - name: Compile overlay Python
        run: |
          python3 -m py_compile files/system/usr/libexec/unwoke/vendor.py
          python3 -m py_compile files/system/usr/libexec/unwoke/setup-gui.py
          python3 -m py_compile docs/_tools/generate-progress.py
          python3 -m py_compile docs/_tools/generate-stock-issues.py
          python3 -m py_compile .github/scripts/mirror-secureblue-docs.py
