name: verify
on:
  workflow_dispatch:
    inputs:
      image:
        description: Image to inspect
        required: true
        type: choice
        default: unwoke-silverblue
        options:
          - unwoke-silverblue
          - unwoke-silverblue-nvidia-open
          - unwoke-kinoite
          - unwoke-kinoite-nvidia-open
          - unwoke-silverblue-browserless
          - unwoke-silverblue-nvidia-open-browserless
          - unwoke-kinoite-browserless
          - unwoke-kinoite-nvidia-open-browserless
permissions: {}
jobs:
  inspect:
    name: Inspect ${{ inputs.image }}
    runs-on: ubuntu-24.04
    permissions:
      packages: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull
        run: podman pull "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ inputs.image }}:latest"

      - name: Check flavor invariants
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}:latest
          IMAGE_NAME: ${{ inputs.image }}
        run: |
          set -euo pipefail
          IMAGE="${IMAGE,,}"
          gone() {
            local pkg="$1"
            if podman run --rm --entrypoint /usr/bin/rpm "$IMAGE" -q "$pkg"; then
              echo "FAIL: $pkg still installed"
              exit 1
            fi
          }
          for pkg in trivalent bazaar gnome-software plasma-discover brave-browser; do
            gone "$pkg"
          done
          if [[ "${IMAGE_NAME}" == *browserless* ]]; then
            if podman run --rm --entrypoint /usr/bin/test "$IMAGE" -e /opt/brave.com/brave-origin/brave; then
              echo "FAIL: Brave Origin ELF on browserless image"
              exit 1
            fi
            if podman run --rm --entrypoint /usr/bin/test "$IMAGE" -e /opt/brave.com/brave/brave; then
              echo "FAIL: full brave-browser ELF still present"
              exit 1
            fi
            gone brave-origin
            podman run --rm --entrypoint /usr/bin/bash "$IMAGE" -lc '
              set -euo pipefail
              [[ "$(tr -d "[:space:]" </usr/share/unwoke/flavor)" == browserless ]]
              if grep -q /opt/brave.com/brave-origin /etc/selinux/targeted/contexts/files/file_contexts 2>/dev/null; then
                echo "FAIL: brave-origin still in file_contexts (brave_t loaded?)"
                exit 1
              fi
              echo "OK: browserless — no Origin, no Trivalent, no store, no brave_t label"
            '
          else
            podman run --rm --entrypoint /usr/bin/test "$IMAGE" -e /opt/brave.com/brave-origin/brave
            if podman run --rm --entrypoint /usr/bin/test "$IMAGE" -e /opt/brave.com/brave/brave; then
              echo "FAIL: full brave-browser ELF still present"
              exit 1
            fi
            podman run --rm --entrypoint /usr/bin/test "$IMAGE" -f /usr/share/unwoke/selinux/unwoke_brave.te
            podman run --rm --entrypoint /usr/bin/bash "$IMAGE" -lc '
              set -euo pipefail
              grep -q brave-origin /etc/selinux/targeted/contexts/files/file_contexts
              if find /opt/brave.com -xdev -perm -4000 -type f | grep -q .; then
                echo "FAIL: SUID remains under /opt/brave.com"
                find /opt/brave.com -xdev -perm -4000 -type f
                exit 1
              fi
              echo "OK: Brave Origin labeled, no SUID"
            '
            echo "OK: Brave Origin present; full Brave, Trivalent, Bazaar, GUI stores absent"
          fi
