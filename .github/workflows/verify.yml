name: verify
on:
  schedule:
    - cron: "30 09 * * *"
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      image:
        description: Image to inspect (schedule inspects all twelve)
        required: true
        type: choice
        default: unwoke-silverblue
        options:
          - unwoke-silverblue
          - unwoke-silverblue-nvidia-open
          - unwoke-kinoite
          - unwoke-kinoite-nvidia-open
          - unwoke-silverblue-browserless
          - unwoke-silverblue-nvidia-open-browserless
          - unwoke-kinoite-browserless
          - unwoke-kinoite-nvidia-open-browserless
          - unwoke-silverblue-trivalent
          - unwoke-silverblue-nvidia-open-trivalent
          - unwoke-kinoite-trivalent
          - unwoke-kinoite-nvidia-open-trivalent
permissions: {}
concurrency:
  group: verify-${{ github.event_name }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  inspect:
    name: Inspect ${{ matrix.image }}
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'workflow_dispatch' || matrix.image == github.event.inputs.image)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        image:
          - unwoke-silverblue
          - unwoke-silverblue-nvidia-open
          - unwoke-kinoite
          - unwoke-kinoite-nvidia-open
          - unwoke-silverblue-browserless
          - unwoke-silverblue-nvidia-open-browserless
          - unwoke-kinoite-browserless
          - unwoke-kinoite-nvidia-open-browserless
          - unwoke-silverblue-trivalent
          - unwoke-silverblue-nvidia-open-trivalent
          - unwoke-kinoite-trivalent
          - unwoke-kinoite-nvidia-open-trivalent
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Inspect published flavor
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/inspect-flavor.sh "${{ matrix.image }}"

  factory-alarm:
    name: Factory alarm
    if: always() && !cancelled() && github.actor != 'dependabot[bot]' && needs.inspect.result == 'failure'
    needs: [inspect]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Open or update alarm
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/factory-alarm.sh open
