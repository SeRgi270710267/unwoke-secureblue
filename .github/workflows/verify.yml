name: verify
on:
  schedule:
    - cron: "30 09 * * *"
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      image:
        description: Image to inspect. "all" (and the schedule) inspects every flavor.
        required: false
        type: choice
        default: all
        options:
          - all
          - unwoke-silverblue
          - unwoke-silverblue-nvidia-open
          - unwoke-kinoite
          - unwoke-kinoite-nvidia-open
          - unwoke-silverblue-browserless
          - unwoke-silverblue-nvidia-open-browserless
          - unwoke-kinoite-browserless
          - unwoke-kinoite-nvidia-open-browserless
          - unwoke-silverblue-trivalent
          - unwoke-silverblue-nvidia-open-trivalent
          - unwoke-kinoite-trivalent
          - unwoke-kinoite-nvidia-open-trivalent
permissions: {}
concurrency:
  group: verify-${{ github.event_name }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  # Do not use `matrix` in a job-level if. workflow_dispatch parse rejects it.
  pick:
    name: Pick images
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      images: ${{ steps.set.outputs.images }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - id: set
        name: Select matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_IMAGE: ${{ github.event.inputs.image }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" && -n "${DISPATCH_IMAGE}" && "${DISPATCH_IMAGE}" != "all" ]]; then
            python3 -c 'import json,os; print("images="+json.dumps([os.environ["DISPATCH_IMAGE"]]))' >> "${GITHUB_OUTPUT}"
          else
            python3 -c 'import json; print("images="+json.dumps(["unwoke-silverblue","unwoke-silverblue-nvidia-open","unwoke-kinoite","unwoke-kinoite-nvidia-open","unwoke-silverblue-browserless","unwoke-silverblue-nvidia-open-browserless","unwoke-kinoite-browserless","unwoke-kinoite-nvidia-open-browserless","unwoke-silverblue-trivalent","unwoke-silverblue-nvidia-open-trivalent","unwoke-kinoite-trivalent","unwoke-kinoite-nvidia-open-trivalent"]))' >> "${GITHUB_OUTPUT}"
          fi

  inspect:
    name: Inspect ${{ matrix.image }}
    needs: pick
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.pick.outputs.images) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Inspect published flavor
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/inspect-flavor.sh "${{ matrix.image }}"

  trust-watch:
    name: Trust / pin / GHCR public
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      packages: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Watch stock key, titanoboa pin, GHCR visibility
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash docs/_tools/watch-trust.sh

  factory-alarm:
    name: Factory alarm
    if: always() && !cancelled() && github.actor != 'dependabot[bot]' && needs.inspect.result == 'failure'
    needs: [inspect]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Open or update alarm
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/factory-alarm.sh open
