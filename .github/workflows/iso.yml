name: iso
# Do not add on: push. Overlay bakes twice a day. USB wraps:
# - the two recommended Trivalent sticks after a successful non-PR
#   bluebuild (workflow_run; still cosign-verify our :latest)
# - all 12 on Sunday 10:00 UTC
# Origin and the other ten stay weekly on purpose. iso-alarm closes
# only on weekly all-12 success. Do not auto-bump titanoboa.
on:
  schedule:
    # Sunday 10:00 UTC — overlay cron is 08:00. All 12 flavors.
    - cron: "00 10 * * 0"
  workflow_dispatch:
    inputs:
      image:
        description: Image to wrap in a live/installer ISO
        required: true
        type: choice
        default: unwoke-silverblue-trivalent
        options:
          - unwoke-silverblue-trivalent
          - unwoke-kinoite-trivalent
          - unwoke-silverblue-nvidia-open-trivalent
          - unwoke-kinoite-nvidia-open-trivalent
          - unwoke-silverblue
          - unwoke-silverblue-nvidia-open
          - unwoke-kinoite
          - unwoke-kinoite-nvidia-open
          - unwoke-silverblue-browserless
          - unwoke-silverblue-nvidia-open-browserless
          - unwoke-kinoite-browserless
          - unwoke-kinoite-nvidia-open-browserless
  workflow_run:
    workflows: ["bluebuild"]
    types: [completed]
permissions: {}
concurrency:
  # Human dispatch of one image is its own lane. Auto baker (Sunday
  # all-12 + post-overlay recommended two) share a group so they queue.
  group: iso-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.image || 'baker' }}
  cancel-in-progress: false
jobs:
  # Do not use `matrix` in a job-level if. workflow_dispatch parse rejects it
  # ("Unrecognized named-value: 'matrix'"), which blocked Run workflow.
  pick:
    name: Pick images
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      images: ${{ steps.set.outputs.images }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - id: set
        name: Select matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_IMAGE: ${{ github.event.inputs.image }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            python3 -c 'import json,os; print("images="+json.dumps([os.environ["DISPATCH_IMAGE"]]))' >> "${GITHUB_OUTPUT}"
          elif [[ "${EVENT_NAME}" == "schedule" ]]; then
            python3 -c 'import json; print("images="+json.dumps(["unwoke-silverblue-trivalent","unwoke-kinoite-trivalent","unwoke-silverblue-nvidia-open-trivalent","unwoke-kinoite-nvidia-open-trivalent","unwoke-silverblue","unwoke-kinoite","unwoke-silverblue-nvidia-open","unwoke-kinoite-nvidia-open","unwoke-silverblue-browserless","unwoke-kinoite-browserless","unwoke-silverblue-nvidia-open-browserless","unwoke-kinoite-nvidia-open-browserless"]))' >> "${GITHUB_OUTPUT}"
          else
            # workflow_run after a green overlay: advertised Trivalent only.
            python3 -c 'import json; print("images="+json.dumps(["unwoke-silverblue-trivalent","unwoke-kinoite-trivalent"]))' >> "${GITHUB_OUTPUT}"
          fi

  iso:
    name: ISO ${{ matrix.image }}
    needs: pick
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
      issues: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        image: ${{ fromJson(needs.pick.outputs.images) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify published Unwoke image
        env:
          IMAGE_NAME: ${{ matrix.image }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REF="ghcr.io/${OWNER}/${IMAGE_NAME}:latest"
          echo "${GITHUB_TOKEN}" | cosign login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          extra=()
          if cosign verify --help 2>&1 | grep -q -- '--new-bundle-format'; then
            extra+=(--new-bundle-format=false)
          fi
          COSIGN_OCI_EXPERIMENTAL=0 cosign verify --key cosign.pub "${extra[@]}" "${REF}" >/dev/null
          echo "IMAGE_REF=${REF}" >> "${GITHUB_ENV}"
          echo "ISO_PKG=ghcr.io/${OWNER}/${IMAGE_NAME}-iso" >> "${GITHUB_ENV}"

      - name: Log in to GHCR (root)
        run: echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull image (root, podman)
        run: sudo podman pull "${{ env.IMAGE_REF }}"

      # ublue-os/titanoboa@main (5c457c3) is the old LiveCD that requires
      # iso.yaml in the OS image. The GitHub action at 840217d still uses
      # extractions/setup-just, which exited 1 in two seconds here. Drive
      # that Justfile ourselves with a checksum-pinned just binary.
      # RoyalOughtness/titanoboa hard-codes secureblue.pub paths — skip it.
      - name: Materialize ISO hooks
        env:
          IMAGE_REF: ${{ env.IMAGE_REF }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib
          src = pathlib.Path(".github/workflows/isos/prep_rootfs.sh")
          text = src.read_text(encoding="utf-8")
          ref = os.environ["IMAGE_REF"]
          if "@IMAGE_REF@" not in text:
              raise SystemExit("prep_rootfs.sh missing @IMAGE_REF@")
          out = pathlib.Path(".github/workflows/isos/prep_rootfs.generated.sh")
          out.write_text(text.replace("@IMAGE_REF@", ref), encoding="utf-8")
          out.chmod(0o755)
          pathlib.Path(".github/workflows/isos/prep_initramfs.sh").chmod(0o755)
          print(f"ISO hook IMAGE_REF={ref}")
          PY

      - name: Install just
        run: bash .github/scripts/install-just.sh

      - name: Checkout titanoboa
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ublue-os/titanoboa
          ref: 840217d97bd0bc9a52466508c54d8dda5c5ba2fd
          path: titanoboa
          persist-credentials: false

      - name: Build ISO
        id: build
        env:
          IMAGE_REF: ${{ env.IMAGE_REF }}
          IMAGE_NAME: ${{ matrix.image }}
          GITHUB_TOKEN: ${{ github.token }}
          COSIGN_PASSWORD: ""
          COSIGN_YES: "1"
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          command -v just
          just --version
          # The chroot podman pull does not see the host login. The auth
          # file is mounted read-only and removed when this step ends.
          AUTH=/var/tmp/unwoke-ghcr-auth.json
          sudo rm -f "${AUTH}"
          trap 'sudo rm -f "${AUTH}"' EXIT
          if [[ -z "${GITHUB_TOKEN:-}" ]]; then
            echo "iso: GITHUB_TOKEN is required to pull the private image" >&2
            exit 1
          fi
          printf '%s\n' "${GITHUB_TOKEN}" | sudo podman login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin --authfile "${AUTH}" >/dev/null
          sudo chmod 600 "${AUTH}"
          bash "${GITHUB_WORKSPACE}/.github/scripts/titanoboa-private-auth.sh" "${GITHUB_WORKSPACE}/titanoboa/Justfile"
          HOOK_POST="$(realpath .github/workflows/isos/prep_rootfs.generated.sh)"
          HOOK_PRE="$(realpath .github/workflows/isos/prep_initramfs.sh)"
          DEST_DIR="${GITHUB_WORKSPACE}/output"
          mkdir -p "${DEST_DIR}"
          DEST="${DEST_DIR}/${IMAGE_NAME}.iso"
          cd titanoboa
          # justfile uses podman -it; allocate a PTY so CI is not "not a TTY".
          sudo --preserve-env=PATH,CI \
            env \
            CI=true \
            HOOK_post_rootfs="${HOOK_POST}" \
            HOOK_pre_initramfs="${HOOK_PRE}" \
            TITANOBOA_BUILDER_DISTRO=fedora \
            script -q -e -c "just build '${IMAGE_REF}' 1 none squashfs NONE '${IMAGE_REF}' 1" /dev/null
          echo "ISO files after just build (maxdepth 3):"
          sudo find "${GITHUB_WORKSPACE}/titanoboa" -maxdepth 3 -name '*.iso' -printf '%s %p\n' | sort -n || true
          SRC=""
          if [[ -f "${PWD}/output.iso" ]]; then
            SRC="${PWD}/output.iso"
          elif [[ -f "${GITHUB_WORKSPACE}/titanoboa/output.iso" ]]; then
            SRC="${GITHUB_WORKSPACE}/titanoboa/output.iso"
          else
            SRC="$(sudo find "${GITHUB_WORKSPACE}/titanoboa" -maxdepth 3 -name '*.iso' -size +100M -printf '%p\n' | tail -n 1 || true)"
          fi
          SRC="$(readlink -f "${SRC}" 2>/dev/null || true)"
          [[ -n "${SRC}" && -f "${SRC}" ]] || {
            echo "FAIL: no ISO after titanoboa" >&2
            exit 1
          }
          sudo chown "$(id -u):$(id -g)" "${SRC}"
          mv -f "${SRC}" "${DEST}"
          ls -lh "${DEST}"
          bytes="$(stat -c '%s' "${DEST}")"
          echo "ISO bytes=${bytes}"
          [[ "${bytes}" -gt 104857600 ]] || {
            echo "FAIL: ISO too small (${bytes} bytes)" >&2
            exit 1
          }
          # Stable name. SHA256SUMS must say latest.iso so the R2 object matches.
          NAMED="${DEST_DIR}/latest.iso"
          mv -f "${DEST}" "${NAMED}"
          (cd "${DEST_DIR}" && sha256sum "$(basename "${NAMED}")" | tee SHA256SUMS)
          echo "ISO_FILE=${NAMED}" >> "${GITHUB_ENV}"
          echo "iso_file=${NAMED}" >> "${GITHUB_OUTPUT}"
          ls -lh "${NAMED}" "${DEST_DIR}/SHA256SUMS"
          export KEY="${RUNNER_TEMP}/unwoke-cosign.key"
          umask 077
          python3 -c 'import os, pathlib; p=pathlib.Path(os.environ["KEY"]); p.write_text(os.environ["COSIGN_PRIVATE_KEY"], encoding="utf-8")'
          [[ -s "${KEY}" ]] || {
            echo "FAIL: SIGNING_SECRET empty" >&2
            exit 1
          }
          python3 -c "import os,pathlib; t=pathlib.Path(os.environ['KEY']).read_text(encoding='utf-8'); lines=[ln for ln in t.splitlines() if 'BEGIN' in ln or 'END' in ln]; print('key bytes', len(t.encode())); print('\\n'.join(lines) or 'FAIL: no PEM BEGIN/END'); raise SystemExit(0 if any('BEGIN' in ln for ln in lines) else 1)"
          export COSIGN_YES=1
          export COSIGN_OCI_EXPERIMENTAL=0
          export COSIGN_EXPERIMENTAL=0
          export COSIGN_TLOG_UPLOAD=false
          # Offline key signature. Do not fail the wrap if public Rekor is unreachable.
          set +e
          COSIGN_YES=1 COSIGN_OCI_EXPERIMENTAL=0 COSIGN_TLOG_UPLOAD=false \
            cosign sign-blob --yes --tlog-upload=false --key "${KEY}" \
            --output-signature "${DEST_DIR}/SHA256SUMS.sig" \
            "${DEST_DIR}/SHA256SUMS"
          sign_rc=$?
          set -e
          if [[ "${sign_rc}" -ne 0 ]]; then
            echo "WARN: cosign sign-blob failed (rc=${sign_rc}); ISO and SHA256SUMS still uploaded"
          elif [[ -s "${DEST_DIR}/SHA256SUMS.sig" ]]; then
            set +e
            COSIGN_OCI_EXPERIMENTAL=0 cosign verify-blob --key "${GITHUB_WORKSPACE}/cosign.pub" \
              --insecure-ignore-tlog \
              --signature "${DEST_DIR}/SHA256SUMS.sig" \
              "${DEST_DIR}/SHA256SUMS"
            set -e
          fi
          shred -u "${KEY}" || rm -f "${KEY}"
          ls -lh "${DEST_DIR}"

      # No Actions artifact. On a public repository anyone logged in can
      # download artifacts. The ISO goes to a private GHCR package instead.
      - name: Install oras
        if: steps.build.outcome == 'success'
        run: bash .github/scripts/install-oras.sh

      - name: Publish ISO to a private package
        if: steps.build.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GHCR_PUBLISH_TOKEN: ${{ secrets.GHCR_PUBLISH_TOKEN }}
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          IMAGE_NAME: ${{ matrix.image }}
          ISO_FILE: ${{ steps.build.outputs.iso_file }}
        run: bash .github/scripts/publish-iso.sh

      # Private R2, served only through the Access site. This does not
      # depend on the GHCR publish step. Missing credentials skip. A size
      # over 9 GB skips and opens r2-free-tier. Each served stick may use
      # at most 4.5 GB. The other ten flavors are not uploaded.
      - name: Publish ISO to private R2
        if: ${{ (success() || failure()) && steps.build.outcome == 'success' }}
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          IMAGE_NAME: ${{ matrix.image }}
          ISO_FILE: ${{ steps.build.outputs.iso_file }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 .github/scripts/r2_iso.py upload

  receipt:
    name: Receipt ISO checksums
    if: always() && !cancelled() && github.actor != 'dependabot[bot]' && needs.iso.result != 'skipped'
    needs: [iso]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      packages: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Retire public receipt release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash docs/_tools/publish-receipt.sh

  public-packages:
    name: GHCR stays private
    if: always() && !cancelled() && github.actor != 'dependabot[bot]' && needs.iso.result != 'skipped'
    needs: [iso]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      issues: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Anonymous pull must fail
        env:
          GH_TOKEN: ${{ github.token }}
          ALARM: "1"
        run: bash .github/scripts/package-visibility.sh

  iso-alarm:
    name: ISO alarm
    if: always() && !cancelled() && github.actor != 'dependabot[bot]' && needs.iso.result != 'skipped'
    needs: [iso]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Open or update alarm
        if: needs.iso.result == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_HINT: ${{ github.event.inputs.image || (github.event_name == 'schedule' && 'weekly-all-12') || 'recommended-trivalent' }}
        run: bash .github/scripts/issue-alarm.sh iso open

      - name: Close alarm
        if: needs.iso.result == 'success' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_HINT: weekly-all-12
        run: bash .github/scripts/issue-alarm.sh iso close
