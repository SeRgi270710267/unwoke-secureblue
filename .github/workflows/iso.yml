name: iso
on:
  workflow_dispatch:
    inputs:
      image:
        description: Image to wrap in a live/installer ISO
        required: true
        type: choice
        default: unwoke-silverblue
        options:
          - unwoke-silverblue
          - unwoke-silverblue-nvidia-open
          - unwoke-kinoite
          - unwoke-kinoite-nvidia-open
          - unwoke-silverblue-browserless
          - unwoke-silverblue-nvidia-open-browserless
          - unwoke-kinoite-browserless
          - unwoke-kinoite-nvidia-open-browserless
permissions: {}
jobs:
  iso:
    name: ISO ${{ inputs.image }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Lowercase registry
        run: echo "IMAGE_REF=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ inputs.image }}:latest" >> "$GITHUB_ENV"

      - name: Log in to GHCR (root)
        run: echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull image (root)
        run: sudo podman pull "${{ env.IMAGE_REF }}"

      - name: Build ISO
        id: build
        uses: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4 # pin main
        with:
          image-ref: ${{ env.IMAGE_REF }}
          iso-dest: ${{ github.workspace }}/${{ inputs.image }}.iso

      - name: Checksum
        run: |
          set -euo pipefail
          IMAGE_NAME="${{ inputs.image }}"
          DATE_SUFFIX="$(date -u +%Y%m%d)"
          mkdir -p output
          mv "${IMAGE_NAME}.iso" "output/unwoke-${IMAGE_NAME}-${DATE_SUFFIX}.iso"
          (cd output && sha256sum *.iso | tee SHA256SUMS)

      - name: Upload ISO
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.image }}-iso
          path: output/
          if-no-files-found: error
          retention-days: 14
