name: iso
# Do not add on: push. Origin USB after a *fully green* main overlay bake
# uses workflow_run (below). Cosign of our :latest still runs before wrap.
# iso-alarm + receipt are the pass/fail signal — do not poll the job in chat.
on:
  schedule:
    # Weekly, after Sunday morning overlay rebuilds. Origin/browserless: dispatch.
    - cron: "00 10 * * 0"
  workflow_run:
    workflows: ["bluebuild"]
    types: [completed]
  workflow_dispatch:
    inputs:
      image:
        description: Image to wrap in a live/installer ISO
        required: true
        type: choice
        default: unwoke-silverblue-trivalent
        options:
          - unwoke-silverblue-trivalent
          - unwoke-kinoite-trivalent
          - unwoke-silverblue-nvidia-open-trivalent
          - unwoke-kinoite-nvidia-open-trivalent
          - unwoke-silverblue
          - unwoke-silverblue-nvidia-open
          - unwoke-kinoite
          - unwoke-kinoite-nvidia-open
          - unwoke-silverblue-browserless
          - unwoke-silverblue-nvidia-open-browserless
          - unwoke-kinoite-browserless
          - unwoke-kinoite-nvidia-open-browserless
permissions: {}
concurrency:
  group: iso-${{ github.event_name }}-${{ github.event.inputs.image || 'weekly' }}
  cancel-in-progress: false
jobs:
  # Do not use `matrix` in a job-level if. workflow_dispatch parse rejects it
  # ("Unrecognized named-value: 'matrix'"), which blocked Run workflow.
  pick:
    name: Pick images
    # Origin auto-wrap: whole bluebuild run must be green (canary + inspect).
    # PRs never wrap. Failed bake skips this job (no ISO, no false alarm).
    if: >
      github.actor != 'dependabot[bot]'
      && (
        github.event_name != 'workflow_run'
        || (
          github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_branch == 'main'
          && github.event.workflow_run.event != 'pull_request'
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      images: ${{ steps.set.outputs.images }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - id: set
        name: Select matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_IMAGE: ${{ github.event.inputs.image }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            python3 -c 'import json,os; print("images="+json.dumps([os.environ["DISPATCH_IMAGE"]]))' >> "${GITHUB_OUTPUT}"
          elif [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            python3 -c 'import json; print("images="+json.dumps(["unwoke-silverblue","unwoke-kinoite","unwoke-silverblue-nvidia-open","unwoke-kinoite-nvidia-open"]))' >> "${GITHUB_OUTPUT}"
          else
            python3 -c 'import json; print("images="+json.dumps(["unwoke-silverblue-trivalent","unwoke-kinoite-trivalent","unwoke-silverblue-nvidia-open-trivalent","unwoke-kinoite-nvidia-open-trivalent"]))' >> "${GITHUB_OUTPUT}"
          fi

  iso:
    name: ISO ${{ matrix.image }}
    needs: pick
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        image: ${{ fromJson(needs.pick.outputs.images) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # Bake SHA so ISO hooks match the overlay we just published.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify published Unwoke image
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REF="ghcr.io/${OWNER}/${IMAGE_NAME}:latest"
          extra=()
          if cosign verify --help 2>&1 | grep -q -- '--new-bundle-format'; then
            extra+=(--new-bundle-format=false)
          fi
          COSIGN_OCI_EXPERIMENTAL=0 cosign verify --key cosign.pub "${extra[@]}" "${REF}" >/dev/null
          echo "IMAGE_REF=${REF}" >> "${GITHUB_ENV}"
          echo "ISO_PKG=ghcr.io/${OWNER}/${IMAGE_NAME}-iso" >> "${GITHUB_ENV}"

      - name: Log in to GHCR (root)
        run: echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull image (root, podman)
        run: sudo podman pull "${{ env.IMAGE_REF }}"

      # ublue-os/titanoboa@main (5c457c3) is the old LiveCD that requires
      # iso.yaml in the OS image. The GitHub action at 840217d still uses
      # extractions/setup-just, which exited 1 in two seconds here. Drive
      # that Justfile ourselves with a checksum-pinned just binary.
      # RoyalOughtness/titanoboa hard-codes secureblue.pub paths — skip it.
      - name: Materialize ISO hooks
        env:
          IMAGE_REF: ${{ env.IMAGE_REF }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib
          src = pathlib.Path(".github/workflows/isos/prep_rootfs.sh")
          text = src.read_text(encoding="utf-8")
          ref = os.environ["IMAGE_REF"]
          if "@IMAGE_REF@" not in text:
              raise SystemExit("prep_rootfs.sh missing @IMAGE_REF@")
          out = pathlib.Path(".github/workflows/isos/prep_rootfs.generated.sh")
          out.write_text(text.replace("@IMAGE_REF@", ref), encoding="utf-8")
          out.chmod(0o755)
          pathlib.Path(".github/workflows/isos/prep_initramfs.sh").chmod(0o755)
          print(f"ISO hook IMAGE_REF={ref}")
          PY

      - name: Install just
        run: bash .github/scripts/install-just.sh

      - name: Checkout titanoboa
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ublue-os/titanoboa
          ref: 840217d97bd0bc9a52466508c54d8dda5c5ba2fd
          path: titanoboa
          persist-credentials: false

      - name: Build ISO
        id: build
        env:
          IMAGE_REF: ${{ env.IMAGE_REF }}
          IMAGE_NAME: ${{ matrix.image }}
          COSIGN_PASSWORD: ""
          COSIGN_YES: "1"
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          command -v just
          just --version
          HOOK_POST="$(realpath .github/workflows/isos/prep_rootfs.generated.sh)"
          HOOK_PRE="$(realpath .github/workflows/isos/prep_initramfs.sh)"
          DEST_DIR="${GITHUB_WORKSPACE}/output"
          mkdir -p "${DEST_DIR}"
          DEST="${DEST_DIR}/${IMAGE_NAME}.iso"
          cd titanoboa
          # justfile uses podman -it; allocate a PTY so CI is not "not a TTY".
          sudo --preserve-env=PATH,CI \
            env \
            CI=true \
            HOOK_post_rootfs="${HOOK_POST}" \
            HOOK_pre_initramfs="${HOOK_PRE}" \
            TITANOBOA_BUILDER_DISTRO=fedora \
            script -q -e -c "just build '${IMAGE_REF}' 1 none squashfs NONE '${IMAGE_REF}' 1" /dev/null
          echo "ISO files after just build (maxdepth 3):"
          sudo find "${GITHUB_WORKSPACE}/titanoboa" -maxdepth 3 -name '*.iso' -printf '%s %p\n' | sort -n || true
          SRC=""
          if [[ -f "${PWD}/output.iso" ]]; then
            SRC="${PWD}/output.iso"
          elif [[ -f "${GITHUB_WORKSPACE}/titanoboa/output.iso" ]]; then
            SRC="${GITHUB_WORKSPACE}/titanoboa/output.iso"
          else
            SRC="$(sudo find "${GITHUB_WORKSPACE}/titanoboa" -maxdepth 3 -name '*.iso' -size +100M -printf '%p\n' | tail -n 1 || true)"
          fi
          SRC="$(readlink -f "${SRC}" 2>/dev/null || true)"
          [[ -n "${SRC}" && -f "${SRC}" ]] || {
            echo "FAIL: no ISO after titanoboa" >&2
            exit 1
          }
          sudo chown "$(id -u):$(id -g)" "${SRC}"
          mv -f "${SRC}" "${DEST}"
          ls -lh "${DEST}"
          bytes="$(stat -c '%s' "${DEST}")"
          echo "ISO bytes=${bytes}"
          [[ "${bytes}" -gt 104857600 ]] || {
            echo "FAIL: ISO too small (${bytes} bytes)" >&2
            exit 1
          }
          # Hash here so the next step cannot lose the path.
          DATE_SUFFIX="$(date -u +%Y%m%d)"
          NAMED="${DEST_DIR}/${IMAGE_NAME}-${DATE_SUFFIX}.iso"
          mv -f "${DEST}" "${NAMED}"
          (cd "${DEST_DIR}" && sha256sum "$(basename "${NAMED}")" | tee SHA256SUMS)
          echo "ISO_FILE=${NAMED}" >> "${GITHUB_ENV}"
          echo "iso_file=${NAMED}" >> "${GITHUB_OUTPUT}"
          ls -lh "${NAMED}" "${DEST_DIR}/SHA256SUMS"
          export KEY="${RUNNER_TEMP}/unwoke-cosign.key"
          umask 077
          python3 -c 'import os, pathlib; p=pathlib.Path(os.environ["KEY"]); p.write_text(os.environ["COSIGN_PRIVATE_KEY"], encoding="utf-8")'
          [[ -s "${KEY}" ]] || {
            echo "FAIL: SIGNING_SECRET empty" >&2
            exit 1
          }
          python3 -c "import os,pathlib; t=pathlib.Path(os.environ['KEY']).read_text(encoding='utf-8'); lines=[ln for ln in t.splitlines() if 'BEGIN' in ln or 'END' in ln]; print('key bytes', len(t.encode())); print('\\n'.join(lines) or 'FAIL: no PEM BEGIN/END'); raise SystemExit(0 if any('BEGIN' in ln for ln in lines) else 1)"
          export COSIGN_YES=1
          export COSIGN_OCI_EXPERIMENTAL=0
          export COSIGN_EXPERIMENTAL=0
          export COSIGN_TLOG_UPLOAD=false
          # Offline key signature. Do not fail the wrap if public Rekor is unreachable.
          set +e
          COSIGN_YES=1 COSIGN_OCI_EXPERIMENTAL=0 COSIGN_TLOG_UPLOAD=false \
            cosign sign-blob --yes --tlog-upload=false --key "${KEY}" \
            --output-signature "${DEST_DIR}/SHA256SUMS.sig" \
            "${DEST_DIR}/SHA256SUMS"
          sign_rc=$?
          set -e
          if [[ "${sign_rc}" -ne 0 ]]; then
            echo "WARN: cosign sign-blob failed (rc=${sign_rc}); ISO and SHA256SUMS still uploaded"
          elif [[ -s "${DEST_DIR}/SHA256SUMS.sig" ]]; then
            set +e
            COSIGN_OCI_EXPERIMENTAL=0 cosign verify-blob --key "${GITHUB_WORKSPACE}/cosign.pub" \
              --insecure-ignore-tlog \
              --signature "${DEST_DIR}/SHA256SUMS.sig" \
              "${DEST_DIR}/SHA256SUMS"
            set -e
          fi
          shred -u "${KEY}" || rm -f "${KEY}"
          ls -lh "${DEST_DIR}"

      - name: Install oras
        run: bash .github/scripts/install-oras.sh

      - name: Publish ISO to GHCR
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COSIGN_PASSWORD: ""
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          ISO_FILE: ${{ steps.build.outputs.iso_file }}
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          ls -lh output/ || true
          if [[ -z "${ISO_FILE:-}" || ! -f "${ISO_FILE}" ]]; then
            ISO_FILE="$(find "${GITHUB_WORKSPACE}/output" -name '*.iso' -size +100M | head -n 1 || true)"
          fi
          [[ -n "${ISO_FILE}" && -f "${ISO_FILE}" ]] || {
            echo "FAIL: no ISO to publish" >&2
            exit 1
          }
          echo "${GITHUB_TOKEN}" | oras login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          # oras 1.2 rejects absolute paths unless --disable-path-validation.
          # Run 20 died here, so ghcr.io/...-iso was never created and the
          # Packages settings URL 404'd. Push from the ISO directory instead.
          iso_dir="$(dirname "${ISO_FILE}")"
          iso_base="$(basename "${ISO_FILE}")"
          files=("${iso_base}:application/vnd.unwoke.iso")
          [[ -s "${iso_dir}/SHA256SUMS" ]] && files+=("SHA256SUMS:text/plain")
          [[ -s "${iso_dir}/SHA256SUMS.sig" ]] && files+=("SHA256SUMS.sig:application/octet-stream")
          push_once() {
            (
              cd "${iso_dir}"
              oras push "${ISO_PKG}:latest" \
                --artifact-type application/vnd.unwoke.iso.v1 \
                "${files[@]}"
            )
          }
          if ! push_once; then
            echo "oras push failed; retry once (same titanoboa pin, no bump)"
            sleep 20
            push_once
          fi
          export KEY="${RUNNER_TEMP}/unwoke-cosign.key"
          umask 077
          python3 -c 'import os, pathlib; pathlib.Path(os.environ["KEY"]).write_text(os.environ["COSIGN_PRIVATE_KEY"], encoding="utf-8")'
          set +e
          COSIGN_YES=1 COSIGN_OCI_EXPERIMENTAL=0 COSIGN_TLOG_UPLOAD=false \
            cosign sign --yes --tlog-upload=false --key "${KEY}" \
            "${ISO_PKG}:latest"
          set -e
          shred -u "${KEY}" || rm -f "${KEY}"

      - name: Upload ISO artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.image }}-iso
          path: output/
          if-no-files-found: error
          retention-days: 14

      - name: Upload ISO checksums
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iso-checksums-${{ matrix.image }}
          path: |
            output/SHA256SUMS
            output/SHA256SUMS.sig
          if-no-files-found: ignore
          retention-days: 2

  receipt:
    name: Receipt ISO checksums
    if: always() && !cancelled() && github.actor != 'dependabot[bot]' && needs.iso.result != 'skipped'
    needs: [iso]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      packages: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download ISO checksums
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: iso-checksums-*
          path: iso-sums
          merge-multiple: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Rewrite receipt (digests + tiny USB sums)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          RECEIPT_SUMS_DIR: iso-sums
        run: bash docs/_tools/publish-receipt.sh

  public-packages:
    name: Public ISO GHCR packages
    if: always() && !cancelled() && github.actor != 'dependabot[bot]' && needs.iso.result != 'skipped'
    needs: [iso]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      issues: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set Unwoke packages public
        env:
          GH_TOKEN: ${{ github.token }}
          ALARM: "1"
        run: bash .github/scripts/public-packages.sh

  iso-alarm:
    name: ISO alarm
    if: always() && !cancelled() && github.actor != 'dependabot[bot]' && needs.iso.result != 'skipped'
    needs: [iso]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Open or update alarm
        if: needs.iso.result == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_HINT: ${{ github.event.inputs.image || (github.event_name == 'workflow_run' && 'origin-after-bake') || 'weekly-trivalent' }}
        run: bash .github/scripts/issue-alarm.sh iso open

      - name: Close alarm
        if: needs.iso.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_HINT: ${{ github.event.inputs.image || (github.event_name == 'workflow_run' && 'origin-after-bake') || 'weekly-trivalent' }}
        run: bash .github/scripts/issue-alarm.sh iso close
