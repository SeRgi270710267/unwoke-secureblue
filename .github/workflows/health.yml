name: health

# One reused issue each Monday. Does not bake, does not merge, does not
# close factory-alarm or iso-alarm. Those close only when their lane is green.

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: health
  cancel-in-progress: false

jobs:
  report:
    name: Factory health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Write the health issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/health_report.py
