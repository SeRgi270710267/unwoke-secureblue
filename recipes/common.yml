---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# Shared overlay applied on top of every official secureblue desktop image.
modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: gschema-overrides
    include:
      - zz2-unwoke.gschema.override

  # Drop secureblue's browser and curated store (script so missing names do not fail the build).
  - type: script
    scripts:
      - remove-stock.sh

  # Official Brave RPM from Brave's own repo. Do not pin `repo: brave-browser`
  # or dnf cannot pull Fedora deps (liberation-fonts, libappindicator, libXss).
  - type: dnf
    repos:
      files:
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
      keys:
        - https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
    install:
      skip-unavailable: false
      packages:
        - liberation-fonts
        - liberation-serif-fonts
        - liberation-sans-fonts
        - liberation-mono-fonts
        - libappindicator-gtk3
        - libXScrnSaver
        - brave-browser

  - type: script
    scripts:
      - apply-unwoke.sh
      - install-stock-store.sh

  - type: signing
