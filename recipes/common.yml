---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# Unwoke SecureBlue. Not affiliated with secureblue.
# MIT License. Copyright (c) 2026 SeRgi270710267.
# UNWOKE-SHIPPED-FIRST
# Shared overlay: strip Bazaar and GUI stores. No browser here —
# recipes add Brave Origin (brave.yml), keep Trivalent (trivalent.yml),
# or ship nothing (browserless.yml).
modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: gschema-overrides
    include:
      - zz1-unwoke-theme.gschema.override

  # GTK setup window (same stamps as ujust setup). dialog = installer-style tty1.
  - type: dnf
    install:
      skip-unavailable: false
      packages:
        - gtk3
        - python3-gobject
        - dialog
        # ISO hook sqlite3 .recover for Origin's malformed RPM sqlite.
        - sqlite
        # Play window: Feral GameMode (governor/GPU while a game runs, restores after).
        - gamemode

  # Do not dnf power-profiles-daemon (conflicts with Fedora tuned-ppd) or
  # scx-scheds/scx-tools (not in Fedora 44). play-window.sh already uses
  # powerprofilesctl if present and scxctl only if Fedora shipped it.

  # Drop Bazaar and any GUI software store. Flavor files drop Trivalent if needed.
  - type: script
    scripts:
      - remove-stock.sh
      - apply-unwoke.sh
      - apply-theme.sh

  # Appends to 60-custom.just. Stock secureblue ujust recipes stay.
  - type: justfiles
    validate: false
