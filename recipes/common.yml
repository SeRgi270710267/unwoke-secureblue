---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# Shared overlay: strip Trivalent, Bazaar, GUI stores. No browser here —
# recipes add either Brave Origin (brave.yml) or nothing (browserless.yml).
modules:
  - type: files
    files:
      - source: system
        destination: /

  # Drop Trivalent, Bazaar, and any GUI software store.
  - type: script
    scripts:
      - remove-stock.sh
      - apply-unwoke.sh

  # Appends to 60-custom.just. Stock secureblue ujust recipes stay.
  - type: justfiles
    validate: false
