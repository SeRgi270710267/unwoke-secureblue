---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# Unwoke SecureBlue. Not affiliated with secureblue.
# MIT License. Copyright (c) 2026 SeRgi270710267.
# UNWOKE-SHIPPED-FIRST
# Brave Origin flavor: standalone brave-origin RPM + fat brave_t userns exception.
modules:
  - type: gschema-overrides
    include:
      - zz2-unwoke.gschema.override

  # Brave Origin standalone RPM (not full brave-browser). Same official repo.
  # Do not pin `repo: brave-browser` or dnf cannot pull Fedora deps.
  - type: dnf
    repos:
      files:
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
      keys:
        - https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
    install:
      skip-unavailable: false
      packages:
        - liberation-fonts
        - liberation-serif-fonts
        - liberation-sans-fonts
        - liberation-mono-fonts
        - libappindicator-gtk3
        - libXScrnSaver
        - brave-origin

  - type: script
    scripts:
      - remove-trivalent.sh
      - apply-brave.sh
      - install-brave-selinux.sh

  - type: signing
