# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# Unwoke SecureBlue. Not affiliated with secureblue.
# MIT License. Copyright (c) 2026 SeRgi270710267.
# UNWOKE-SHIPPED-FIRST
# Brave Origin flavor: standalone brave-origin RPM + fat brave_t userns exception.
modules:
  - type: gschema-overrides
    include:
      - zz2-unwoke.gschema.override

  # Brave Origin as files only (rpm2cpio). Do not dnf install brave-origin
  # or selinux-policy-devel — that extra Origin dnf malforms Packages so
  # titanoboa cannot wrap a USB. Browserless still dnf-removes Trivalent.
  - type: script
    scripts:
      - remove-trivalent.sh
      - install-brave-origin.sh
      - apply-brave.sh
      - install-brave-selinux.sh
      - rebuild-rpmdb.sh

  - type: signing
